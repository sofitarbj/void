name: CI Build — macOS

on:
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./product.json').voidVersion ?? require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  build-macos:
    name: Build macOS (Universal / arm64)
    needs: resolve-version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Build React components
        run: npm run buildreact
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Package macOS app
        run: npx gulp vscode-darwin-arm64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Codeen-macOS-arm64-${{ env.VERSION }}
          path: .build/darwin/arm64/*
          retention-days: 7
